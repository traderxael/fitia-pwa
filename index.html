<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Registra tus comidas, controla tus macros y sigue tu progreso corporal.">
  <title>NutriPlan</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>

  <div class="app-shell">
    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Navegación principal">
      <button class="tab" type="button" data-tab="plan" aria-label="Plan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h8M8 10h8M8 15h5"/><rect x="4" y="3" width="16" height="18" rx="4"/></svg>
        <span>Plan</span>
      </button>
      <button class="tab" type="button" data-tab="social" aria-label="Social">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3"/><path d="M3.5 19c.5-3.1 2.7-4.8 5.5-4.8s5 1.7 5.5 4.8"/><path d="M16 6.5a3 3 0 0 1 0 5.6M17.5 14.6c2 .5 3.2 1.9 3.5 4.4"/></svg>
        <span>Social</span>
      </button>
      <button class="tab" type="button" data-tab="progreso" aria-label="Progreso">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v3M12 10v9M18 5v14"/></svg>
        <span>Progreso</span>
      </button>
      <button class="tab" type="button" data-tab="coach" aria-label="Coach">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        <span>Coach</span>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
